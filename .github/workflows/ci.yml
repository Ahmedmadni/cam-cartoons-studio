name: Character Studio CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun x tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Premium background assets
        run: |
          test "$(find public/backgrounds/premium -type f -name '*.avif' | wc -l)" -eq 8
          test "$(find public/backgrounds/premium -type f -name '*.avif' -size +1k | wc -l)" -eq 8

      - name: Python syntax
        run: python -m py_compile services/voice-api/app.py
