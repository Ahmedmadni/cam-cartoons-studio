name: Character Studio CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun x tsc --noEmit

      - name: Character catalog tests
        run: bun test tests/

      - name: Production build
        run: bun run build

      - name: Premium background assets
        run: |
          test "$(find public/backgrounds/premium -type f -name '*.avif' | wc -l)" -eq 8
          test "$(find public/backgrounds/premium -type f -name '*.avif' -size +1k | wc -l)" -eq 8

      - name: Python syntax
        run: python -m py_compile services/voice-api/app.py


      - name: Set up Python browser tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install headless Chromium for WebGL QA
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Generate deterministic GLB browser fixture
        run: python scripts/generate_qa_glb.py

      - name: Chromium 3D character smoke
        run: python scripts/browser_model_smoke.py

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-review-screenshots
          path: artifacts/model-review/
          if-no-files-found: ignore
