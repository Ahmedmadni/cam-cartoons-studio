name: 2D Social Content Studio CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartoon-content-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun x tsc --noEmit
      - name: All unit tests (new 2D and retained legacy data contracts)
        run: bun test tests/
      - name: Production build
        run: bun run build
      - name: Python syntax
        run: |
          python -m py_compile scripts/browser_social_smoke.py
          python -m py_compile services/voice-api/app.py
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Chromium 2D editor, audio mux and mobile layout
        run: python scripts/browser_social_smoke.py
      - name: Retained legacy storyboard data/recovery regression
        run: python scripts/browser_storyboard_smoke.py
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-2d-review-screenshots
          path: artifacts/social-review/
          if-no-files-found: ignore
